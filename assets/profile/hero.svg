<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Sagar Ghag — Mobile and Frontend Engineer</title>
  <desc id="desc">Animated futuristic developer profile banner</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".52" stop-color="#11153d"/>
      <stop offset="1" stop-color="#071b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-width="1" opacity=".12"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="1" y="1" width="1198" height="378" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="24" fill="url(#background)" stroke="#334155"/>
  <g clip-path="url(#panelClip)">
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="1050" cy="180" r="260" fill="url(#glow)">
      <animate attributeName="opacity" values=".45;.9;.45" dur="5s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="-4" width="1200" height="3" fill="#22d3ee" opacity=".42" filter="url(#softGlow)">
      <animate attributeName="y" values="8;372;8" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.55;.08" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="34" cy="30" r="5" fill="#fb7185"/>
  <circle cx="52" cy="30" r="5" fill="#fbbf24"/>
  <circle cx="70" cy="30" r="5" fill="#34d399"/>
  <text x="92" y="35" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">~/ghagsagar23/profile</text>

  <text x="70" y="110" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4">HELLO, WORLD. I AM</text>
  <text x="66" y="185" fill="url(#accent)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="2">SAGAR GHAG</text>
  <text x="70" y="225" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">Mobile Engineer  /  Flutter Specialist  /  Frontend Builder</text>

  <path d="M70 252H770" stroke="url(#accent)" stroke-width="2" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="70" y="277" width="116" height="34" rx="17" fill="#0f2537" stroke="#22d3ee" stroke-opacity=".65"/>
    <text x="128" y="299" text-anchor="middle" fill="#67e8f9">FLUTTER</text>
    <rect x="198" y="277" width="172" height="34" rx="17" fill="#161b42" stroke="#818cf8" stroke-opacity=".65"/>
    <text x="284" y="299" text-anchor="middle" fill="#a5b4fc">MOBILE SYSTEMS</text>
    <rect x="382" y="277" width="106" height="34" rx="17" fill="#1e183e" stroke="#c084fc" stroke-opacity=".65"/>
    <text x="435" y="299" text-anchor="middle" fill="#d8b4fe">VUE.JS</text>
    <rect x="500" y="277" width="154" height="34" rx="17" fill="#0f2537" stroke="#22d3ee" stroke-opacity=".65"/>
    <text x="577" y="299" text-anchor="middle" fill="#67e8f9">OPEN SOURCE</text>
  </g>

  <g transform="translate(980 185)">
    <circle r="108" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 9" opacity=".55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="79" fill="#0b132f" fill-opacity=".8" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="50" fill="#101937" stroke="#c084fc" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="stroke-opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="9" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">&lt;/&gt;</text>
    <circle cx="0" cy="-108" r="5" fill="#22d3ee" filter="url(#softGlow)"/>
    <circle cx="79" cy="0" r="5" fill="#c084fc" filter="url(#softGlow)"/>
  </g>

  <text x="70" y="348" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">SYSTEM.STATUS: BUILDING  //  MODE: COLLABORATIVE  //  SIGNAL: OPEN</text>
</svg>
